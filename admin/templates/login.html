{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block solo %}
<form method="post" action="/login" class="login card">
  <h1>CareerSniper admin</h1>
  <p class="muted small">Staff only. Every sign-in and every change is logged.</p>
  {% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}
  <label>Email<input name="email" type="email" required autocomplete="username" autofocus></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
  <button type="submit">Sign in</button>
</form>
{% endblock %}
