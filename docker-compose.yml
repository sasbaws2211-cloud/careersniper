services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  db:
    image: postgres:16
    environment: {POSTGRES_USER: careersniper, POSTGRES_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}", POSTGRES_DB: careersniper}
    volumes: [pgdata:/var/lib/postgresql/data]
  app:
    build: .
    depends_on:
      db: {condition: service_started}
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://careersniper:${DB_PASSWORD}@db:5432/careersniper
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: "${SECRET_KEY:?set SECRET_KEY}"
      BASE_DOMAIN: "${BASE_DOMAIN:?set BASE_DOMAIN}"
    ports: ["8000:8000"]
volumes:
  pgdata:
