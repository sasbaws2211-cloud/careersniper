{% extends "_tenant.html" %}{% block title %}Sign in · {{ org.name if org is defined and org else PLATFORM }}{% endblock %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto"><h2>Sign in</h2>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post"><input type="hidden" name="next" value="{{ next }}">
<label>Email<input name="email" type="email" required autofocus></label>
<label>Password<input name="password" type="password" required></label>
<p><button>Sign in</button></p></form>
<p class="muted"><a href="/member/forgot">Forgot your password?</a> · <a href="/member/signup?next={{ next|urlencode }}">Create an account</a></p></div>
{% endblock %}
