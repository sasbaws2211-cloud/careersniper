<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ doc.title }}</title>
<style>
  body { font-family: Georgia, "Times New Roman", serif; max-width: 760px; margin: 24px auto; padding: 0 20px; color: #111; line-height: 1.45; }
  pre { white-space: pre-wrap; word-wrap: break-word; font: inherit; margin: 0; }
  .bar { font-family: system-ui, sans-serif; margin-bottom: 16px; font-size: 14px; color: #555; }
  button { font: inherit; padding: 6px 14px; }
  @media print { .bar { display: none; } body { margin: 0; max-width: none; } }
</style>
</head>
<body>
<div class="bar"><button onclick="window.print()">Print or save as PDF</button> &nbsp; Choose &ldquo;Save as PDF&rdquo; as the destination to get a file.</div>
<pre>{{ doc.content }}</pre>
</body>
</html>
