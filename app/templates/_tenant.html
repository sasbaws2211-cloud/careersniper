<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{{ seo.title if seo is defined and seo and seo.get('title') else (org.name if org is defined and org else PLATFORM) ~ ' · Jobs' }}{% endblock %}</title>
{% include "_seo.html" %}
  <link rel="stylesheet" href="/static/app.css?v={{ CSS_V }}">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <style>:root{--brand:{{ org.brand_color if org is defined and org else '#2563eb' }}}</style>
  {% block head %}{% endblock %}
</head>
<body>
{% include "_header.html" %}
<div class="wrap">{% block body %}{% endblock %}</div>
<footer class="wrap" style="padding:24px 0;color:#9ca3af;font-size:0.85rem">
  <a href="/jobs">Jobs</a> · <a href="/pricing">Pricing</a> · <a href="/salaries">Salaries</a> · <a href="/blog">Blog</a> · <a href="/alternatives">Alternatives</a> · <a href="/refunds">Refunds</a>
  {% if memail %} · <a href="/account">Account</a>{% endif %}
</footer>
<script src="/static/confirm.js?v={{ CSS_V }}"></script>
<script src="/static/loading.js?v={{ CSS_V }}"></script>
</body>
</html>
