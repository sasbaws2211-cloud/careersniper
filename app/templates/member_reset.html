{% extends "_tenant.html" %}{% block title %}Choose a new password · {{ org.name if org is defined and org else PLATFORM }}{% endblock %}{% block body %}
<div class="card" style="max-width:420px;margin:40px auto"><h2>Choose a new password</h2>
{% if error %}<div class="err">{{ error }}</div>{% endif %}
<form method="post"><label>New password (8+ characters)<input name="password" type="password" minlength="8" maxlength="72" required autofocus></label><p><button>Save password</button></p></form></div>
{% endblock %}
