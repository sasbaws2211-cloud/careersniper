<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" role="img" aria-label="CareerSniper">
  <defs>
    <linearGradient id="mark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F3A"/>
      <stop offset="100%" stop-color="#1E3A5F"/>
    </linearGradient>
  </defs>
  <!-- App icon -->
  <rect x="0" y="4" width="64" height="64" rx="16" fill="url(#mark)"/>
  <!-- Outer precision ring -->
  <circle cx="32" cy="36" r="18" fill="none" stroke="#3B82F6" stroke-width="2.25"/>
  <!-- Inner ring -->
  <circle cx="32" cy="36" r="10" fill="none" stroke="#93C5FD" stroke-width="1.5" opacity="0.9"/>
  <!-- Center dot -->
  <circle cx="32" cy="36" r="3.2" fill="#60A5FA"/>
  <!-- Subtle tick marks (N/E/S/W) -->
  <g stroke="#60A5FA" stroke-width="1.75" stroke-linecap="round">
    <line x1="32" y1="14" x2="32" y2="18"/>
    <line x1="32" y1="54" x2="32" y2="58"/>
    <line x1="14" y1="36" x2="18" y2="36"/>
    <line x1="46" y1="36" x2="50" y2="36"/>
  </g>
  <!-- Wordmark -->
  <text x="80" y="46" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="650" fill="#0B1F3A" letter-spacing="-0.8">CareerSniper</text>
</svg>
